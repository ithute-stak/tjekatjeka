name: Tjekatjeka CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tjekatjeka_test
          POSTGRES_USER: tjekatjeka
          POSTGRES_PASSWORD: tjekatjeka-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tjekatjeka -d tjekatjeka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/backend
    env:
      TJEKATJEKA_DATABASE_URL: postgresql+psycopg://tjekatjeka:tjekatjeka-test@127.0.0.1:5432/tjekatjeka_test
      TJEKATJEKA_DEV_AUTH_BYPASS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q app alembic
      - run: alembic upgrade head
      - run: alembic current
      - run: PYTHONPATH=. pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          TJEKATJEKA_DEV_AUTH_BYPASS: "true"
          TJEKATJEKA_PUBLIC_URL: "http://localhost:3204"
          TJEKATJEKA_BACKEND_INTERNAL_URL: "http://localhost:8204"
          TJEKATJEKA_COOKIE_SECURE: "false"
